[project]
name = "meu_pacote"
version = "0.0.0"
description = "Projeto ROS 2 com domínio, serviços e adaptadores."
# Estes campos vêm do setup.py (colcon), não deste arquivo.
dynamic = ["dependencies", "license", "maintainers", "optional-dependencies"]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
# Projeto "virtual": o build e a instalação são feitos pelo colcon (setup.py), não pelo uv.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
